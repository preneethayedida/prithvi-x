version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: prithvix-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - prithvix_mongo_data:/data/db
    networks:
      - prithvix-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: prithvix-analytics
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - prithvix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prithvix-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/prithvix
      - ANALYTICS_SERVICE_URL=http://analytics:8000
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000,http://frontend:80
      - ENABLE_AUTO_INGESTION=true
      - USE_FALLBACK_IF_API_FAILS=true
    depends_on:
      mongodb:
        condition: service_healthy
      analytics:
        condition: service_healthy
    networks:
      - prithvix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prithvix-frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - prithvix-network

networks:
  prithvix-network:
    driver: bridge

volumes:
  prithvix_mongo_data:
    driver: local
